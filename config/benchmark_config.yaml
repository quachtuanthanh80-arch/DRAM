# Q-Shield Architectural Benchmark Configuration
# Defines default presets, workloads, timing parameters, and Monte Carlo settings.

simulation_defaults:
  warmup_cycles: 100000
  execution_cycles: 2000000
  clock_ratio: 2
  base_seed: 12345
  default_repeats: 10
  confidence_level: 0.95

clock_domains:
  host_axi_mhz: 250.0
  dram_core_mhz: 400.0
  cdc_sync_stages: 2

dram_presets:
  DDR4-3200:
    standard: "JEDEC JESD79-4"
    channel_width_bits: 64
    ranks: 1
    bank_groups: 4
    banks_per_group: 4
    tCK_ns: 0.625
    timings:
      tCL: 22
      tRCD: 22
      tRP: 22
      tRAS: 52
      tRFC: 350
      tREFI_us: 7.8
    peak_bandwidth_gbps: 25.6

  DDR5-4800:
    standard: "JEDEC JESD79-5"
    channel_width_bits: 32 # Per subchannel
    subchannels_per_channel: 2
    ranks: 1
    bank_groups: 8
    banks_per_group: 4
    tCK_ns: 0.4167
    timings:
      tCL: 40
      tRCD: 40
      tRP: 40
      tRAS: 64
      tRFC: 295
      tREFI_us: 3.9
    peak_bandwidth_gbps: 19.2 # Per subchannel (31.36 GB/s aggregated dual)

  DDR5-5600:
    standard: "JEDEC JESD79-5"
    channel_width_bits: 32
    subchannels_per_channel: 2
    ranks: 1
    bank_groups: 8
    banks_per_group: 4
    tCK_ns: 0.3571
    timings:
      tCL: 46
      tRCD: 46
      tRP: 46
      tRAS: 72
      tRFC: 295
      tREFI_us: 3.9
    peak_bandwidth_gbps: 22.4

workloads:
  benign:
    - trace_file: "trace_benign.trace"
      suite: "SPEC CPU2017 & PARSEC 3.0"
      description: "Standard mixed compute baseline"
  adversarial:
    - trace_file: "trace_rowhammer.trace"
      attack: "Alternating Double-Sided RowHammer"
    - trace_file: "trace_blacksmith.trace"
      attack: "IEEE S&P'22 Blacksmith Multi-Sided Frequency Hammer"
    - trace_file: "trace_rowpress.trace"
      attack: "Prolonged Activation RowPress"
    - trace_file: "trace_multitenant_adversarial.trace"
      attack: "8-Thread Co-Located Multi-Tenant Contention"
