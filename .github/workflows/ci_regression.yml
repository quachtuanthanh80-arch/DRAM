name: Hardware CI & Full Verification Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Blocking job: the Icarus-Verilog regression, which is the regression that is maintained alongside the RTL.
  regression:
    name: Icarus Regression and Finding Reproduction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make iverilog

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify Toolchain
        run: |
          iverilog -V | head -1
          python --version

      - name: Validate Documentation Consistency
        run: python tools/check_documentation_consistency.py

      - name: Runner Integrity Gate
        run: python tools/check_gate.py

      - name: Finding Reproduction Suite
        run: python tb/findings/run_findings.py

      - name: Core Top-Level Testbench
        run: python run_iverilog_regression.py --only tb_axi_ddr5_mc_top

      - name: Encryption and Integrity Layer Testbench
        run: python run_iverilog_regression.py --only tb_secure_top_integrity

  # Non-blocking job: the cocotb + Verilator suites. Several of them are out of date with respect to the current RTL
  # (Verilator width and pin warnings, and stale expected values); they are listed in LIMITATIONS.md.
  cocotb-legacy:
    name: Cocotb + Verilator Suites (known failing, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev make help2man flex bison iverilog

      - name: Set up Verilator Simulator (>= 5.036)
        uses: veryl-lang/setup-verilator@v1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Cocotb Suites
        continue-on-error: true
        run: python run_all_tests.py --skip-gate --skip-findings --skip-corner-matrix
