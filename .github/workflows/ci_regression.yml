name: Hardware CI & Full Verification Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  regression:
    name: RTL Lint & Cocotb Hardware Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hardware Simulators & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator build-essential zlib1g-dev make

      - name: Install Python Verification Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cocotb pytest

      - name: Verify Environment & Toolchain
        run: |
          verilator --version
          make --version
          python -c "import cocotb_tools.config; print('Cocotb Makefiles:', cocotb_tools.config.makefiles_dir)"

      - name: Run Master Verification & Regression Suite
        run: |
          python run_all_tests.py

      - name: Upload Verification Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-regression-reports
          path: |
            **/results.xml
          if-no-files-found: ignore
